---
version: "3"

env:
  HUGO_BUILD_VERSION: dev
  HUGO_BUILD_TIME:
    sh: |
      date -u +"%Y-%m-%dT%H:%M:%SZ"

includes:
  lint: .taskfiles/lint.yaml
  setup: .taskfiles/setup.yaml

tasks:
  default:
    silent: true
    cmd: task -l

  init:
    desc: Install dependencies and setup environment
    cmds:
      - task: setup:init
      - task: node-modules-install
      - task: update-theme

  start:
    desc: Run development server
    cmd: hugo server --navigateToChanged

  start-drafts:
    desc: Run development server
    cmd: hugo server --navigateToChanged --buildDrafts

  start-full:
    desc: Run development server with full rebuilds (better for CSS changes)
    cmd: hugo server --navigateToChanged --disableFastRender

  build:
    desc: Build production static site
    cmd: hugo --minify --cleanDestinationDir

  kill:
    desc: Kill process running on client dev ßport
    cmd: lsof -t -i tcp:1313 | xargs kill

  check:
    desc: Run project checks
    cmds:
      - task: lint:lint
      - bun run check
      - task: build

  fix:
    desc: Fix project checks
    cmds:
      - bun run fix
      - hugo mod tidy

  node-modules-install:
    cmd: bun install
    status:
      - test -d node_modules

  update-theme:
    desc: Update git submodules
    cmd: git submodule update --init --recursive --remote
