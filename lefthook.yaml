---
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,js,css,json,jsonc}"
      run: mise exec bun -- bunx biome check --write {staged_files}
      stage_fixed: true
    gitleaks:
      run: mise exec gitleaks -- gitleaks git --staged --redact --config .github/gitleaks.toml

pre-push:
  commands:
    check:
      run: task check
